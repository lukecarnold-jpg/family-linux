name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Python syntax
        run: |
          python -m compileall src tests

      - name: Run pytest test suite
        run: |
          pytest -v --durations=10

      - name: Run Family Linux CLI & bootstrap smoke tests
        env:
          PARENT_PASS: "ci-only-Pass1"
        run: |
          chmod +x scripts/bootstrap-prototype.sh scripts/build-autoinstall-iso.sh
          ./scripts/bootstrap-prototype.sh --help
          ./scripts/bootstrap-prototype.sh install --dry-run --non-interactive --parent-user "admin" --parent-name "Admin" --parent-pass "$PARENT_PASS"
          ./scripts/bootstrap-prototype.sh ctl status
          ./scripts/bootstrap-prototype.sh ctl user add testchild --name "Test Child" --tier young_child
          ./scripts/bootstrap-prototype.sh ctl app approve testchild tuxpaint
          ./scripts/bootstrap-prototype.sh ctl time set testchild --daily-limit 90 --bedtime-weekday 20:00
          ./scripts/bootstrap-prototype.sh ctl web block badsite.com
          ./scripts/bootstrap-prototype.sh ctl audit
          ./scripts/bootstrap-prototype.sh policyd --one-shot
          ./scripts/bootstrap-prototype.sh autoinstall ci-autoinstall.yaml
          test -f ci-autoinstall.yaml

  linux-integration:
    name: Privileged Linux integration (Python 3.12 on ubuntu-latest)
    runs-on: ubuntu-latest
    # Creates real accounts, rewrites /etc/sudoers.d, and enables UFW.
    # Safe only because the runner is ephemeral.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ufw apparmor-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests as root
        env:
          FAMILY_LINUX_INTEGRATION: "1"
        run: |
          sudo -E env "PATH=$PATH" FAMILY_LINUX_INTEGRATION=1 \
            "$(which python)" -m pytest tests/integration -v -p no:cacheprovider

  live-install:
    name: Live install and verify (Ubuntu VM with systemd and AppArmor)
    runs-on: ubuntu-latest
    # Applies a real policy to the ephemeral runner VM: creates accounts, enables UFW,
    # loads the AppArmor profile, and changes DNS. Nothing after this step needs the network.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ufw apparmor-utils unattended-upgrades nftables

      - name: Install Family Linux
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply policy as root (live, not dry-run)
        run: |
          sudo -E env "PATH=$PATH" "$(which python)" -m family_linux.installer.wizard \
            --non-interactive \
            --parent-user ciparent \
            --parent-name "CI Parent" \
            --parent-pass "CiParentPass1" \
            --child "cikid:CI Kid:young_child:CiKidPass1"
          id cikid
          id ciparent

      - name: Verify baseline on the live system
        run: sudo "$(which python)" -m family_linux.cli.family_ctl verify

      - name: Confirm the child AppArmor profile is loaded and launches a process
        run: |
          sudo aa-status | grep -q family-linux-child
          sudo aa-exec -p family-linux-child -- /bin/true
          echo "aa-exec launch under family-linux-child: ok"

      - name: Confirm the child profile enforces its deny rules
        run: |
          # Positive control: a read the profile does not deny must still succeed.
          sudo aa-exec -p family-linux-child -- cat /etc/hostname > /dev/null
          echo "control read (/etc/hostname): allowed"
          # The profile denies /etc/shadow; the read must fail while it is confined.
          if sudo aa-exec -p family-linux-child -- cat /etc/shadow > /dev/null 2>&1; then
            echo "FAIL: /etc/shadow readable under family-linux-child"
            exit 1
          fi
          echo "/etc/shadow read: denied as expected"

      - name: Confirm the child profile blocks command lines and the desktop lockdown is written
        run: |
          # aa-exec changes profile on exec, but the exec itself is checked against the caller
          # (unconfined root). The check that matters is a confined process starting a shell,
          # so run the shell through an allowed binary (env) inside the profile.
          for shell in /bin/sh /bin/bash; do
            if sudo aa-exec -p family-linux-child -- /usr/bin/env "$shell" -c true > /dev/null 2>&1; then
              echo "FAIL: confined process started $shell"
              exit 1
            fi
            echo "confined start of $shell: denied"
          done
          # Positive control for the same check: a permitted binary still runs.
          sudo aa-exec -p family-linux-child -- /usr/bin/env true
          test -f /etc/dconf/db/local.d/00-family-linux
          test -f /etc/dconf/db/local.d/locks/00-family-linux
          echo "desktop lockdown files written"

      - name: Confirm the per-child DNS gateway filters each child separately
        run: |
          # tiktok.com is blocked for every child by default (see WebFilterPolicy).
          systemctl is-active family-dnsd
          sudo nft list table inet family_linux | grep -q "skuid"
          child=$(sudo -u cikid getent ahostsv4 tiktok.com | awk 'NR==1{print $1}')
          echo "child lookup tiktok.com -> ${child:-none}"
          test "$child" = "0.0.0.0"
          parent=$(sudo -u ciparent getent ahostsv4 tiktok.com | awk 'NR==1{print $1}')
          echo "parent lookup tiktok.com -> ${parent:-none}"
          test -n "$parent" && test "$parent" != "0.0.0.0"

      - name: Confirm a child cannot use DNS outside the gateway
        run: |
          # Port 53 to any address is redirected to the child's gateway. A query sent to 8.8.8.8
          # must therefore be answered by the gateway, which returns 0.0.0.0 for a blocked name.
          sudo -u cikid python3 - <<'PY'
          import socket, struct
          labels = b"".join(bytes([len(p)]) + p.encode() for p in "tiktok.com".split(".")) + b"\0"
          query = struct.pack("!HHHHHH", 0x4242, 0x0100, 1, 0, 0, 0) + labels + struct.pack("!HH", 1, 1)
          sock = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          sock.settimeout(5)
          sock.sendto(query, ("8.8.8.8", 53))
          reply, _ = sock.recvfrom(512)
          answer = reply[-4:]
          print("child query to 8.8.8.8 for tiktok.com answered with:", ".".join(str(b) for b in answer))
          assert answer == b"\0\0\0\0", "query to an outside resolver was not intercepted"
          PY
          # DNS over TLS is dropped for children.
          if sudo -u cikid timeout 5 bash -c 'exec 3<>/dev/tcp/1.1.1.1/853' 2>/dev/null; then
            echo "FAIL: child reached DNS over TLS"; exit 1
          fi
          echo "DNS over TLS from child: blocked"

      - name: Confirm a blocked lookup becomes a request and approval unblocks it
        run: |
          sudo -u cikid getent ahostsv4 omegle.com > /dev/null || true
          # The gateway flushes requests every 30 seconds.
          sleep 35
          sudo "$(which python)" -m family_linux.cli.family_ctl web requests | tee /tmp/requests.txt
          grep -q "omegle.com" /tmp/requests.txt
          sudo "$(which python)" -m family_linux.cli.family_ctl web approve cikid omegle.com
          sleep 2
          approved=$(sudo -u cikid getent ahostsv4 omegle.com | awk 'NR==1{print $1}')
          echo "child lookup omegle.com after approval -> ${approved:-none}"
          test -n "$approved" && test "$approved" != "0.0.0.0"
