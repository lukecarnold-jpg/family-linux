[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "family-linux"
version = "0.1.0"
description = "Child-safe Linux experience that parents can manage simply, built on Ubuntu LTS."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Family Linux Contributors"}
]
keywords = ["parental-controls", "ubuntu", "child-safe", "linux-security", "family-linux"]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
family-installer = "family_linux.installer.wizard:main"
family-ctl = "family_linux.cli.family_ctl:main"
family-policyd = "family_linux.screentime.daemon:main"
family-parent-dashboard = "family_linux.parent_ui.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
